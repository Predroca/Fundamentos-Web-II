<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Pessoas</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <main class="container">
        <section class="form-box">
            <div class="form-row">
                <label for="codigo">Código:</label>
                <input type="text" id="codigo" readonly>
            </div>

            <div class="form-row">
                <label for="nome">Nome:</label>
                <input type="text" id="nome">
            </div>

            <div class="form-row">
                <label for="telefone">Telefone:</label>
                <input type="text" id="telefone" placeholder="(34) 99999-0000">
            </div>

            <div class="form-row">
                <label for="email">Email:</label>
                <input type="email" id="email">
            </div>

            <button id="btnSalvar">Salvar</button>
            <button id="btnCancelar" class="secondary hidden">Cancelar</button>
            <span id="mensagem"></span>
        </section>

        <section class="table-box">
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Nome</th>
                        <th>Telefone</th>
                        <th>Email</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaPessoas"></tbody>
            </table>

            <p id="vazio" class="vazio">Nenhum cadastro encontrado.</p>
        </section>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
